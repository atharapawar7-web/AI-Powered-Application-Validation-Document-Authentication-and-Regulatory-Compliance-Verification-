version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    container_name: aicte-verify-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    container_name: aicte-verify-app
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/app_db
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  pgdata:
